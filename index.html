<!doctype html>
<html lang="en">
  <head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-1G4X5FM0CQ"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-1G4X5FM0CQ', { anonymize_ip: true });
    </script>

    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/title.png" />
    <link rel="apple-touch-icon" href="/title.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#030014" />
    <meta name="color-scheme" content="dark" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Speed up the first TMDB poster and API connection -->
    <link rel="preconnect" href="https://image.tmdb.org" crossorigin />
    <link rel="preconnect" href="https://api.themoviedb.org" crossorigin />
    <link rel="dns-prefetch" href="https://image.tmdb.org" />
    <link rel="dns-prefetch" href="https://www.googletagmanager.com" />

    <!--
      Fonts are loaded here instead of via @import so they no longer sit in the
      critical CSS request chain. `display=optional` keeps the fallback metrics
      for the first paint, which removes the font-swap layout shift (CLS).
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:opsz,wght@9..40,100..1000&display=optional"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:opsz,wght@9..40,100..1000&display=optional"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Film Point needs JavaScript enabled to search movies and load details.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
